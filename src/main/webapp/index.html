<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Portal de acceso de Café Don Bosco">
  <title>Café Don Bosco</title>
  <link rel="stylesheet" href="assets/css/portal.css">
</head>
<body>
  <main class="fondo">
    <section class="portal" aria-labelledby="titulo-portal">
      <header class="marca">
        <div class="titulo">
          <svg class="logo-taza" viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="29" cy="44" rx="24" ry="7" fill="#d8d0c7"/><ellipse cx="29" cy="42" rx="17" ry="5" fill="#f3eee8"/><path d="M14 19h31l-3 20c-1 7-23 7-25 0z" fill="#e8dfd6" stroke="#7c5b43" stroke-width="2"/><ellipse cx="29.5" cy="20" rx="15.5" ry="8" fill="#ece3da" stroke="#745139" stroke-width="2"/><ellipse cx="29.5" cy="20" rx="11" ry="5.5" fill="#6b3d25"/><path d="M44 24c14-3 14 14 0 12" fill="none" stroke="#ded4ca" stroke-width="6"/><path d="M45 25c10-2 10 9 0 9" fill="none" stroke="#76543e" stroke-width="1.5"/></svg>
          <h1 id="titulo-portal">Cafe Don Bosco</h1>
        </div>
        <p class="lema">Buen cafe, mejores momentos</p>
      </header>
      <p class="pregunta">¿Como quieres entrar?</p>
      <div class="opciones">
        <a class="tarjeta" href="login" aria-label="Entrar como administrador">
          <span class="icono"><svg viewBox="0 0 90 78" aria-hidden="true"><defs><linearGradient id="a" x1="0" x2="1"><stop stop-color="#bd8a63"/><stop offset="1" stop-color="#76503a"/></linearGradient></defs><rect x="38" y="9" width="43" height="37" rx="2" fill="none" stroke="#8a6146" stroke-width="3"/><path d="M46 38V23m8 15V28m8 10V20m8 18V14" stroke="#8a6146" stroke-width="3"/><path d="m44 25 10-8 8 5 13-11" fill="none" stroke="#d2aa82" stroke-width="3"/><circle cx="27" cy="27" r="13" fill="url(#a)" stroke="#6c4936" stroke-width="2"/><path d="M7 69c1-20 8-29 20-29s19 9 21 29z" fill="url(#a)" stroke="#6c4936" stroke-width="2"/></svg></span>
          <h2>Soy Administrador</h2><p>Gestiona el mostrador:<br>dashboard, ventas e historial.<br>Requiere inicio de sesion.</p><span class="boton">Iniciar Sesión</span>
        </a>
        <a class="tarjeta" href="tienda" aria-label="Entrar como consumidor">
          <span class="icono"><svg viewBox="0 0 90 72" aria-hidden="true"><defs><radialGradient id="b"><stop stop-color="#f0c985"/><stop offset=".72" stop-color="#bd7941"/><stop offset="1" stop-color="#6e442d"/></radialGradient></defs><ellipse cx="43" cy="41" rx="34" ry="22" fill="url(#b)" stroke="#6f452d" stroke-width="2"/><ellipse cx="40" cy="34" rx="24" ry="14" fill="#f0dfc1" stroke="#9e693d" stroke-width="2"/><path d="M57 34c21-5 23 18 4 18" fill="none" stroke="#79513a" stroke-width="6"/><path d="M26 36c7-10 13 4 24-8M24 31c9 1 9-8 18-6M31 41c8-9 13 1 21-6" fill="none" stroke="#fffaf0" stroke-width="2.5" stroke-linecap="round"/></svg></span>
          <h2>Soy Consumidor</h2><p>Explora el menu y compra<br>directo, sin necesidad de<br>crear una cuenta.</p><span class="boton">Explorar Menú</span>
        </a>
      </div>
    </section>
    <i class="grano g1"></i><i class="grano g2"></i><i class="grano g3"></i><i class="grano g4"></i><i class="grano g5"></i><i class="grano g6"></i>
  </main>
  <script src="assets/js/portal.js"></script>
</body>
</html>
